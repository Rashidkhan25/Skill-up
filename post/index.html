<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Application</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="hamburger" onclick="toggleMenu()">
          <i class="fas fa-bars"></i>
        </div>
        <nav id="navMenu" class="nav-menu">
          <ul>
            <li><a href="#"><i class="fas fa-user"></i> Profile</a></li>
            <li><a href="#"><i class="fas fa-list"></i> To Do List</a></li>
            <li><a href="#"><i class="fas fa-calendar-alt"></i> Calendar</a></li>
            <li><a href="#"><i class="fas fa-question-circle"></i> Quiz</a></li>
            <li><a href="#"><i class="fas fa-video"></i> Videos</a></li>
            <li><a href="#"><i class="fas fa-newspaper"></i> News</a></li>
            <li><a href="../Discord room/index.html"><i class="fa-solid fa-users"></i> Group Disscusion</a></li>
          </ul>
        </nav>
        <h1>Skill<span class="highlight">Up</span> Post </h1>
      </header>
    <div class="container">
        <button id="composeButton" onclick="toggleComposeModal()">Create Post</button>
        
        <div id="composeModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="toggleComposeModal()">&times;</span>
                <h2>Create a New Post</h2>
                <textarea id="newPostText" placeholder="What's on your mind?" rows="4"></textarea>
                <input type="file" id="newPostImage" accept="image/*">
                <button id="post" onclick="createPost()">Post</button>
            </div>
        </div>

        <div id="postsContainer" class="posts-container"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
