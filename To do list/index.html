<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="hamburger" onclick="toggleMenu()">
          <i class="fas fa-bars"></i>
        </div>
        <nav id="navMenu" class="nav-menu">
          <ul>
            <li><a href="#"><i class="fas fa-user"></i> Profile</a></li>
            <li><a href="#"><i class="fas fa-list"></i> To Do List</a></li>
            <li><a href="#"><i class="fas fa-calendar-alt"></i> Calendar</a></li>
            <li><a href="#"><i class="fas fa-question-circle"></i> Quiz</a></li>
            <li><a href="#"><i class="fas fa-video"></i> Videos</a></li>
            <li><a href="#"><i class="fas fa-newspaper"></i> News</a></li>
            <li><a href="../Discord room/index.html"><i class="fa-solid fa-users"></i> Group Disscusion</a></li>
          </ul>
        </nav>
        <h1>Skill<span class="highlight">Up</span> To-do List </h1>
      </header>
    <div class="wrapper">
        <div class="header">
            <h1>To-Do List</h1>
            <button class="add-task-btn" id="toggle-form"><i class="fas fa-plus"></i></button>
        </div>

        <div class="categories">
            <div class="category">
                <i class="fas fa-laptop-code"></i>
                <h1>Programming</h1>
            </div>
            <div class="category">
                <i class="fas fa-book"></i>
                <h1>Studying</h1>
            </div>
            <div class="category">
                <i class="fas fa-user-graduate"></i>
                <h1>Placements</h1>
            </div>
        </div>

        <div class="tasks">
            <div id="taskList"></div>
        </div>

        <div class="add-task" id="taskForm">
            <input type="text" id="taskInput" placeholder="Add a new task...">
            <input type="time" id="reminderTime" placeholder="Set Reminder">
            <button class="add-btn" id="addTaskBtn">Add</button>
        </div>

        <div class="progress-bar">
            <div class="progress" id="progressBar" style="width: 0%;"></div>
        </div>

        <footer>SkillUp © 2024</footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
