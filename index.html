<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <title>Login Page</title>
  </head>
  <body>
    <div id="navbar">
      <a class="logo"><img id="logo" src="logo.png" alt="Logo"></a>
    </div>

    <div class="container" id="container">
      <div class="sign-up">
        <form action="/submit" method="post">
          <h1>Create Account</h1>
          <div class="icons">
            <a href="#" class="icon"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://www.instagram.com/__skillup08__" class="icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
            <a href="https://github.com/Rashidkhan25/Skill-up" class="icon"><i class="fa-brands fa-github"></i></a>
          </div>
          <span>Use your email for registration</span>
          <input type="text" placeholder="Name" class="input" name="name" required />
          <input type="email" placeholder="Email" class="input" name="email" required />
          <input type="password" placeholder="Password" class="input" name="password" required />
          <button id="button" type="submit">Sign Up</button>
        </form>
      </div>

      <!-- Sign In Section -->
      <div class="sign-in">
        <form action="/login" method="post">
          <h1>Sign In</h1>
          <div class="icons">
            <a href="#" class="icon"><i class="fa-brands fa-facebook"></i></a>
            <a href="https://www.instagram.com/__skillup08__?igsh=Y3d4YzJjajdhcjk0" class="icon"><i class="fa-brands fa-instagram"></i></a>
            <a href="#" class="icon"><i class="fa-brands fa-google"></i></a>
            <a href="https://github.com/Rashidkhan25/Skill-up" class="icon"><i class="fa-brands fa-github"></i></a>
          </div>
          <span>Use email password</span>
          <input type="text" placeholder="Email" class="input" name="Email" required>
          <input type="password" placeholder="Password" class="input" name="password" required/>
          <a href="#">Forgot password ?</a>
          <button id="signInButton" type="button">Sign In</button>
        </form>
      </div>
      <div class="toogle-container">
        <div class="toogle">
          <div class="toogle-panel toogle-left">
            <h1>Welcome User!</h1>
            <p>If you already have an account</p>
            <button class="hidden" id="login">Sign In</button>
          </div>
          <div class="toogle-panel toogle-right">
            <h1>Hello, User!</h1>
            <p>If you don't have an account</p>
            <button class="hidden" id="register">Sign Up</button>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
