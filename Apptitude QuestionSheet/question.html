<!DOCTYPE html>
<html>
<head>
  <title>SkillUp Question Sheet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    body {
      font-family: sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }

    header {
    background-color: #3524a3;
    color: #fff;
    padding: 1rem 0;
    text-align: center;
    width: 100%;
  }

  h1 {
    margin: 0;
    color: #fff;
  }

  h1 .highlight {
    color: orange;
  }

  .hamburger {
    display: block; 
    font-size: 30px;
    cursor: pointer;
    position: absolute;
    top: 20px;
    left: 20px;
  }
  
  .nav-menu ul {
    list-style-type: none;
    margin: 0;
    padding: 0;
    padding-top: 20px;
    z-index: 999;
  }
  
  .nav-menu ul li {
    display: block;
    margin: 15px 0;
    text-align: left;
    margin: 20px;
    font-size: larger;
  }
  
  .nav-menu ul li a {
    text-decoration: none;
    color: #ffffff;
  }
  
  .nav-menu ul li a i{
    margin-right: 10px;
  }

  .nav-menu {
    display: none;
    background-color: #3524a3c2;
    position: absolute;
    left: 0;
    top: 60px;
    width: 280px;
    height:100%;
    z-index: 999;
  }
  
  .nav-menu.open {
    display: block;
    color: #f0f0f0;
  }
  
  @media (max-width: 768px) {
    .hamburger {
      display: block;
    }
  
    .nav-menu {
      display: none; 
    }
  }
  
  .nav-menu ul li:hover {
  background-color: #3524a3;
  border-radius: 5px;
  text-align: center;
  padding: 7px;
  }

    nav {
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 1rem 0;
    }

    .button {
      background-color: #4285f4;
      color: #fff;
      padding: 1rem 2rem;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .button:hover {
      background-color: #100d9d;
    }

    table {
      width: 90%;
      margin: 2rem auto;
      border-collapse: collapse;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 1.5rem;
      text-align: left;
    }

    th {
      background-color: #e9ecef;
      text-align: center;
    }

    .problem-title {
      font-weight: bold;
    }

    .status, .revisit {
      text-align: center;
      width: 12%; 
    }

    .status button, .revisit button {
      width: 100px;
      padding: 0.5rem 1rem;
      border-radius: 5px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    .solved {
      background-color: #4caf50;
      color: #fff;
    }

    .unsolved {
      background-color: #f44336;
      color: #fff;
    }

    .revisit button {
      background-color: #ffeb3b;
      color: #282c34;
    }

    .progress-container {
      width: 90%;
      margin: 2rem auto;
      display: flex;
      align-items: center;
    }

    .progress-bar {
      flex-grow: 1;
      height: 30px;
      background-color: #ddd;
      border-radius: 5px;
      position: relative;
      z-index: 100;
    }

    .progress-bar-fill {
      height: 100%;
      background-color: #4285f4;
      border-radius: 5px;
      width: 0%;
      transition: width 0.3s;
    }

    .progress-text {
      margin-left: 1rem;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <header>
    <div class="hamburger" onclick="toggleMenu()">
      <i class="fas fa-bars"></i>
    </div>
    <nav id="navMenu" class="nav-menu">
      <ul>
        <li><a href="#"><i class="fas fa-user"></i> Profile</a></li>
        <li><a href="#"><i class="fas fa-list"></i> To Do List</a></li>
        <li><a href="#"><i class="fas fa-calendar-alt"></i> Calendar</a></li>
        <li><a href="#"><i class="fas fa-question-circle"></i> Quiz</a></li>
        <li><a href="#"><i class="fas fa-video"></i> Videos</a></li>
        <li><a href="#"><i class="fas fa-newspaper"></i> News</a></li>
        <li><a href="../Discord room/index.html"><i class="fa-solid fa-users"></i> Group Disscusion</a></li>
      </ul>
    </nav>
    <h1>Skill<span class="highlight">Up</span> Apptitude Sheet </h1>
  </header>

  <nav>
    <button class="button" onclick="loadQuestions(100)">General Apptitude</button>
    <button class="button" onclick="loadQuestions(200)">Verbal and Reasoning</button>
    <button class="button" onclick="loadQuestions(300)">Current Affairs and GK</button>
    <button class="button" onclick="loadQuestions(400)">Programming</button>
    <button class="button" onclick="loadQuestions(500)">Puzzles</button>
  </nav>

  <div class="progress-container">
    <div class="progress-bar">
      <div class="progress-bar-fill" style="width: 0%;"></div>
    </div>
    <h2 class="progress-text"><span id="solved-count">0</span>/10 Solved</h2>
  </div>

  <table id="question-table">
    <thead>
      <tr>
        <th>S.No</th>
        <th>Problem</th>
        <th class="status">Status</th>
        <th class="revisit">Revisit</th>
      </tr>
    </thead>
    <tbody>
    </tbody>
  </table>

  <script>
    let solvedProblems = 0;

    const questionSets = {
      100: [
        { title: 'Problem on Trains', url: 'https://www.indiabix.com/aptitude/problems-on-trains/' },
        { title: 'Compound Interest', url: 'https://www.indiabix.com/aptitude/compound-interest/' },
        { title: 'Profit and Loss', url: 'https://www.indiabix.com/aptitude/profit-and-loss/' },
        { title: 'Bar Charts', url: 'https://www.indiabix.com/data-interpretation/bar-charts/' },
        { title: 'Surds and Indices', url: 'https://www.indiabix.com/aptitude/surds-and-indices/' },
        { title: 'Permutation and Combination', url: 'https://www.indiabix.com/aptitude/permutation-and-combination/' },
        { title: 'Height and Distance', url: 'https://www.indiabix.com/aptitude/height-and-distance/' },
        { title: 'Pie Charts', url: 'https://www.indiabix.com/data-interpretation/pie-charts/' },
        { title: 'Line Charts', url: 'https://www.indiabix.com/data-interpretation/line-charts/' },
        { title: 'Ratio and Proportion', url: 'https://www.indiabix.com/aptitude/ratio-and-proportion/' }
      ],
      
      200: [
        { title: 'Synonyms', url: 'https://www.indiabix.com/verbal-ability/synonyms/' },
        { title: 'Antonyms', url: 'https://www.indiabix.com/verbal-ability/antonyms/' },
        { title: 'Sentence Correction', url: 'https://www.indiabix.com/verbal-ability/sentence-correction/' },
      { title: 'Idioms and Phrases', url: 'https://www.indiabix.com/verbal-ability/idioms-and-phrases/' },
      { title: 'Letter and Symbol Series', url: 'https://www.indiabix.com/logical-reasoning/letter-and-symbol-series/' },
      { title: 'Verbal Reasoning', url: 'https://www.indiabix.com/logical-reasoning/verbal-reasoning/' },
      { title: 'Blood Relation Test', url: 'https://www.indiabix.com/verbal-reasoning/blood-relation-test/' },
      { title: 'seating Arrangement', url: 'https://www.indiabix.com/verbal-reasoning/seating-arrangement/' },
      { title: 'Series', url: 'https://www.indiabix.com/non-verbal-reasoning/series/' },
      { title: 'Cubes and Dice', url: 'https://www.indiabix.com/non-verbal-reasoning/cubes-and-dice/' },
      ],

      300: [
      { title: 'Basic General Knowledge', url: 'https://indiabix.com/general-knowledge/basic-general-knowledge/' },
      { title: 'Physics', url: 'https://www.indiabix.com/general-knowledge/physics/' },
      { title: 'World Geography', url: 'https://www.indiabix.com/general-knowledge/world-geography/' },
      { title: 'Chemistry', url: 'https://www.indiabix.com/general-knowledge/chemistry/' },
      { title: 'Sports', url: 'https://www.indiabix.com/general-knowledge/sports/' },
      { title: 'Indian Geography', url: 'https://www.indiabix.com/general-knowledge/indian-geography/' },
      { title: 'Biology', url: 'https://www.indiabix.com/general-knowledge/biology/' },
      { title: 'Books and Authors', url: 'https://www.indiabix.com/general-knowledge/books-and-authors/' },
      { title: 'Indian Economy', url: 'https://www.indiabix.com/general-knowledge/indian-economy/' },
      { title: 'Indian History', url: 'https://www.indiabix.com/general-knowledge/indian-history/' },
    ],
      
    400:[ 
      { title: 'C++ OOPS concept', url: 'https://www.indiabix.com/cpp-programming/oops-concepts/' },
      { title: 'C++ Objects and Classes concept', url: 'https://www.indiabix.com/cpp-programming/objects-and-classes/' },
      { title: 'C++ Constructors and Destructors concept', url: 'https://www.indiabix.com/cpp-programming/constructors-and-destructors/' },
      { title: 'C# Polymorphism', url: 'https://www.indiabix.com/c-sharp-programming/polymorphism/' },
      { title: 'C# Attributes', url: 'https://www.indiabix.com/c-sharp-programming/attributes/' },
      { title: 'C# Generics', url: 'https://www.indiabix.com/c-sharp-programming/generics/' },
      { title: 'JAVA Exceptions', url: 'https://www.indiabix.com/java-programming/exceptions/' },
      { title: 'JAVA Operators and Assignments', url: 'https://www.indiabix.com/java-programming/operators-and-assignments/' },
      { title: 'JAVA Threads ', url: 'https://www.indiabix.com/java-programming/threads/' },
      { title: 'JAVA lava-lang Class', url: 'https://www.indiabix.com/java-programming/java-lang-class/' },
    ],

    500: [
      { title: 'Sudoku', url: 'https://www.indiabix.com/puzzles/sudoku/' },
      { title: 'Number Puzzles', url: 'https://www.indiabix.com/puzzles/number-puzzles/' },
      { title: 'Missing Letters', url: 'https://www.indiabix.com/puzzles/missing-letters-puzzles/' },
      { title: 'Logical Puzzles', url: 'https://www.indiabix.com/puzzles/logical-puzzles/' },
      { title: 'Playing Cards', url: 'https://www.indiabix.com/puzzles/playing-cards-puzzles/' },
      { title: 'Clock Puzzles', url: 'https://www.indiabix.com/puzzles/clock-puzzles/' },
    ],
    };

    const progressBarFill = document.querySelector('.progress-bar-fill');
    const questionTableBody = document.querySelector('#question-table tbody');

    function loadQuestions(setNumber) {
      const questions = questionSets[setNumber];
      questionTableBody.innerHTML = ''; 

      questions.forEach((question, index) => {
        const row = document.createElement('tr');

        row.innerHTML = `
          <td>${index + 1}</td>
          <td><a href="${question.url}" class="problem-title">${question.title}</a></td>
          <td class="status">
            <button class="unsolved" onclick="toggleSolved(this)">Unsolved</button>
          </td>
          <td class="revisit">
            <button onclick="toggleRevisit(this)">Revisit</button>
          </td>
        `;

        questionTableBody.appendChild(row);
      });
    }

    function updateProgressBar() {
      const progressPercentage = (solvedProblems / 10) * 100;
      progressBarFill.style.width = progressPercentage + '%';
      document.getElementById('solved-count').innerText = solvedProblems;
    }

    function toggleSolved(button) {
      if (button.classList.contains('unsolved')) {
        button.classList.remove('unsolved');
        button.classList.add('solved');
        button.innerText = 'Solved';
        solvedProblems++;
      } else {
        button.classList.remove('solved');
        button.classList.add('unsolved');
        button.innerText = 'Unsolved';
        solvedProblems--;
      }
      updateProgressBar();
    }

    function toggleRevisit(button) {
      if (button.innerText === 'Revisit') {
        button.innerText = 'Bookmarked';
        button.style.backgroundColor = '#ffa500';
      } else {
        button.innerText = 'Revisit';
        button.style.backgroundColor = '#ffeb3b';
      }
    }

    loadQuestions(100);

    function toggleMenu() {
    const navMenu = document.getElementById('navMenu');
    navMenu.classList.toggle('open');
  }
  </script>
</body>
</html>
